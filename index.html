<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>Unity Web Player | Livronautas</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #003f7f;
            touch-action: none;
            overscroll-behavior: none;
        }

        #unity-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #unity-canvas {
            display: block;
            background: #000;
        }

        #unity-loading-bar {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 18px;
            color: #fff;
            background: #004f9f;
            font-family: Arial, Helvetica, sans-serif;
            transition: opacity 200ms ease;
        }

        #unity-loading-bar.is-hidden {
            opacity: 0;
            pointer-events: none;
        }

        #unity-loading-title {
            font-size: clamp(22px, 4vw, 40px);
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        #unity-progress-bar-empty {
            width: min(280px, 60vw);
            height: 14px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.2);
        }

        #unity-progress-bar-full {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: #fff;
            transition: width 100ms linear;
        }
    </style>
</head>

<body>
    <div id="unity-wrapper">
        <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
        <div id="unity-loading-bar" role="progressbar" aria-label="Carregando" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="unity-loading-title">Livronautas</div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>

    <script src="Build/7743ce649f29502d9af8cd6799abb6b3.loader.js"></script>

    <script>
        const canvas = document.querySelector("#unity-canvas");
        const loadingBar = document.querySelector("#unity-loading-bar");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const ASPECT = 16 / 9;

        function fitCanvas() {
            const viewport = window.visualViewport;
            const viewportWidth = viewport ? viewport.width : window.innerWidth;
            const viewportHeight = viewport ? viewport.height : window.innerHeight;

            let width = viewportWidth;
            let height = width / ASPECT;

            if (height > viewportHeight) {
                height = viewportHeight;
                width = height * ASPECT;
            }

            canvas.style.width = width + "px";
            canvas.style.height = height + "px";
        }

        window.addEventListener("resize", fitCanvas);
        window.addEventListener("orientationchange", () => {
            setTimeout(fitCanvas, 100);
        });

        if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", fitCanvas);
        }

        fitCanvas();

        createUnityInstance(canvas, {
            arguments: [],
            dataUrl: "Build/0a61d2b737017d7870ef0bbd53cb6076.data.unityweb",
            frameworkUrl: "Build/b4787d2aea85dd093c8a34602aaa1a51.framework.js.unityweb",
            codeUrl: "Build/fa8d4f58509f8d8a876d687693c7d81e.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "SESI",
            productName: "Livronautas",
            productVersion: "1.0",
            matchWebGLToCanvasSize: true,
        }, (progress) => {
            const percentage = Math.round(progress * 100);
            progressBarFull.style.width = percentage + "%";
            loadingBar.setAttribute("aria-valuenow", percentage);
        }).then((unityInstance) => {
            fitCanvas();
            loadingBar.classList.add("is-hidden");
            loadingBar.addEventListener("transitionend", () => loadingBar.remove(), { once: true });
        }).catch((message) => {
            alert(message);
        });
    </script>
</body>
</html>
