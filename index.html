    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);

      gtag("js", new Date());
      gtag("config", "G-HJ1XR21KSS");

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: url("Build/background.png") center center / cover no-repeat;
        touch-action: none;
        overscroll-behavior: none;
      }

      #unity-wrapper {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      #unity-canvas {
        display: block;
        background: #000;
      }
    </style>

  <body>
    <!-- Wrapper is what centers the canvas -->
    <div id="unity-wrapper">
      <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
    </div>

    <script src="Build/602edfe79d948e5a70a72108a4143b03.loader.js"></script>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const ASPECT = 16 / 9;

      function fitCanvas() {
          const viewport = window.visualViewport;

          const vw = viewport ? viewport.width : window.innerWidth;
          const vh = viewport ? viewport.height : window.innerHeight;

          let width = vw;
          let height = width / ASPECT;

          if (height > vh) {
              height = vh;
              width = height * ASPECT;
          }

          canvas.style.width = width + "px";
          canvas.style.height = height + "px";
      }

      window.addEventListener("resize", fitCanvas);

      window.addEventListener("orientationchange", () => {
          setTimeout(fitCanvas, 100);
      });

      if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", fitCanvas);
      }

      fitCanvas();

      createUnityInstance(canvas, {
          arguments: [],
          dataUrl: "Build/4ccabbe2e69896d346d1ab2cf46755dd.data.unityweb",
          frameworkUrl: "Build/781c2c765727a702dee8b499d87c1f52.framework.js.unityweb",
          codeUrl: "Build/80061d05596c225ba1485471564e29b3.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "SESI",
          productName: "Livronautas",
          productVersion: "1.0",
          matchWebGLToCanvasSize: true,
          //devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
          fitCanvas();
      }).catch((message) => {
          alert(message);
      });
    </script>
  </body>
